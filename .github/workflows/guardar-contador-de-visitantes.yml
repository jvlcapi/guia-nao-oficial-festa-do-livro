name: Guardar contador de visitantes

on:
  workflow_dispatch:
  schedule:
    # Todo dia às 7h de Brasília. Os selos dos READMEs mostram o total guardado aqui, porque o serviço do contador às vezes cai
    # (novembro de 2026). Ler o contador também evita que ele expire: o serviço apaga contadores sem acesso por 6 meses.
    - cron: "0 10 * * *"

permissions:
  contents: write

concurrency:
  group: guardar-contador-de-visitantes
  cancel-in-progress: false

jobs:
  guardar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Anotar o total de visitantes
        env:
          ENDERECO_DO_CONTADOR: https://abacus.jasoncameron.dev/get/guia-nao-oficial-festa-do-livro/visitantes
          ARQUIVO_DO_HISTORICO: data/visitantes.csv
          ARQUIVO_DO_SELO: data/selo-de-visitantes.json
        run: |
          resposta="$RUNNER_TEMP/contador.json"
          situacao=$(curl -sS --max-time 30 -o "$resposta" -w '%{http_code}' "$ENDERECO_DO_CONTADOR" || true)
          if [ "$situacao" = "404" ]; then
            echo "O contador não existe: ou o site publicado ainda não teve visitas, ou o contador expirou. O histórico até aqui está em $ARQUIVO_DO_HISTORICO." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Fora do ar, o serviço responde erro, às vezes com HTTP 200 e {"error": ...} no lugar do total.
          total=$(python3 -c 'import json, sys; print(int(json.load(open(sys.argv[1]))["value"]))' "$resposta" 2>/dev/null || true)
          if [ "$situacao" != "200" ] || [ -z "$total" ]; then
            echo "::warning::O contador não deu o total (HTTP $situacao: $(head -c 200 "$resposta" 2>/dev/null)). Os selos continuam com o último total guardado em $ARQUIVO_DO_SELO."
            exit 0
          fi
          echo "Visitantes únicos (um por navegador): $total" >> "$GITHUB_STEP_SUMMARY"

          python3 -c 'import json, sys; open(sys.argv[1], "w").write(json.dumps({"schemaVersion": 1, "label": "visitantes únicos", "message": sys.argv[2], "color": "c0352b"}, ensure_ascii=False) + "\n")' "$ARQUIVO_DO_SELO" "$total"
          [ -f "$ARQUIVO_DO_HISTORICO" ] || echo "data,visitantes" > "$ARQUIVO_DO_HISTORICO"
          if [ "$(tail -n 1 "$ARQUIVO_DO_HISTORICO" | cut -d, -f2)" != "$total" ]; then
            echo "$(date -u +%F),$total" >> "$ARQUIVO_DO_HISTORICO"
          fi
          if git diff --quiet -- "$ARQUIVO_DO_HISTORICO" "$ARQUIVO_DO_SELO"; then
            echo "Nenhum visitante novo desde a última anotação."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$ARQUIVO_DO_HISTORICO" "$ARQUIVO_DO_SELO"
          git commit -m "Anota total de visitantes únicos: $total"
          git pull --rebase
          git push
